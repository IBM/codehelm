[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codehelm-sfs"
version = "0.1.0"
description = "codehelm algorithm plugin: Scattered Forest Search (SFS) synthesis repair strategy"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["codehelm", "algorithm", "SFS", "synthesis", "MCTS"]
# codehelm itself is not listed: it is not on PyPI, so install it first.
dependencies = []

[project.optional-dependencies]
qiskit = [
    "qiskit>=2.1.0",
    "qiskit-aer==0.17.0",
    "qiskit-ibm-runtime==0.45.0",
    "qiskit_qasm3_import==0.5.0",
    "pylatexenc==2.10",
    "qiskit_experiments==0.9.0",
    "qiskit-ibm-transpiler==0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
